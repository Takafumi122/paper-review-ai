[project]
name = "paper-review-ai"
version = "0.1.0"
description = "Evidence-grounded LLM/NLP paper reading assistant"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
  "fastapi>=0.136,<0.137",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0.45,<2.1",
  "alembic>=1.16,<2",
  "uvicorn>=0.48,<0.49",
  "pdfplumber>=0.11.10",
  "httpx>=0.28,<0.29",
  "tiktoken>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_review"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "pyright>=1.1.408,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19", "mako>=1.4.2", "pillow>=13.0.0"]
