name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PAPER_REVIEW_DATABASE_PATH: ${{ github.workspace }}/.work/ci-validation.db
      UV_CACHE_DIR: ${{ github.workspace }}/.work/uv-cache
      UV_NO_ENV_FILE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check publication files and history
        run: python3 scripts/check_publication.py --tracked --history
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          mkdir -p .work
          uv sync --locked
          npm --prefix frontend ci --no-audit --no-fund
      - name: Backend checks (offline)
        run: |
          uv run pytest -q
          uv run ruff check src tests scripts main.py migrations
          uv run pyright
          uv run alembic upgrade head
          uv run alembic check
      - name: Frontend checks and static build
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build
